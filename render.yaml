services:
  - type: web
    name: portfolio-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false